services:
  postgres:
    image: docker.io/library/postgres:17
    container_name: no-code-agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: motor_sales
      POSTGRES_USER: motor_admin
      POSTGRES_PASSWORD: motor_password

    ports:
      - "5432:5432"

    volumes:
      - motor_postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U motor_admin -d motor_sales
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: docker.io/library/adminer:latest
    container_name: no-code-agent-adminer
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  motor_postgres_data: